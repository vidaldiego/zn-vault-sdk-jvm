name: Audit verification contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew :zn-vault-core:test --tests com.zincapp.vault.AuditVerificationContractTest
